name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile Resource
      run: windres app.rc -O coff -o app.res

    - name: Compile C++ and Link
      run: |
        cl /EHsc /std:c++17 /O2 /DUNICODE /D_UNICODE ipv6_route_monitor_gui.cpp app.res ^
           /link /SUBSYSTEM:WINDOWS /OUT:ipv6_route_monitor_gui.exe ^
           user32.lib gdi32.lib shell32.lib advapi32.lib ws2_32.lib iphlpapi.lib comctl32.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ipv6_route_monitor_gui
        path: ipv6_route_monitor_gui.exe
